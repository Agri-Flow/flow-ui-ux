<!doctype html>
<!-- @archetype: list -->
<!-- render-gate fixture: GOOD baseline. Must pass C0,C1,C2,C3,C4,C5,C6.
     Represents a correct list/table screen (cf. user-list.html precedent). -->
<html lang="en" data-archetype="list">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture — list baseline (good)</title>
  <link rel="stylesheet" href="../_shared/tokens.css">
</head>
<body>
  <main class="page">
    <h1>Product Categories</h1>
    <p class="sub">Taxonomy for catalog filtering.</p>

    <!-- populated -->
    <section class="card state-band" data-state-band="populated">
      <span class="eyebrow">Populated</span>
      <div class="row"><span>Vegetables</span><span>Active</span></div>
      <div class="row"><span>Fruits</span><span>Active</span></div>
    </section>

    <!-- loading -->
    <section class="card state-band" data-state-band="loading">
      <span class="eyebrow">Loading — skeleton</span>
      <div class="skeleton" style="width:60%"></div>
      <div class="skeleton" style="width:80%"></div>
    </section>

    <!-- empty (zero data) -->
    <section class="card state-band" data-state-band="empty">
      <span class="eyebrow">Empty — no categories yet</span>
      <p>No categories yet. Create your first to see it here.</p>
      <button class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Add Category
      </button>
    </section>

    <!-- filtered-empty (distinct from zero-data) -->
    <section class="card state-band" data-state-band="filtered-empty">
      <span class="eyebrow">Filtered empty</span>
      <p>No categories match this filter.</p>
    </section>

    <!-- error + retry -->
    <section class="card state-band" data-state-band="error">
      <span class="eyebrow">Error — load failed</span>
      <p>Couldn't load categories.</p>
      <button class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Retry
      </button>
    </section>
  </main>
</body>
</html>
