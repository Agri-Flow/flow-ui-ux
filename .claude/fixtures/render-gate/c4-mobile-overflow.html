<!doctype html>

<!-- render-gate fixture: c4-mobile-overflow — fixed-width child forces horizontal scroll at mobile -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture — c4-mobile-overflow</title>
<link rel="stylesheet" href="_shared/tokens.css"></head><body><main class="page">
<h1>Product Categories</h1>
