name: CI

# Deterministic design-system gate for flow-ui — guards the PROMOTED contract.
#
# Runs the canonical 24-gate linter (.claude/scripts/lint-prototypes.sh) on the
# PROMOTED screens (ui-flow/agriflow-rwanda-design-system/project/screens/*.html) —
# the single source of truth flow-fe and other agents consume. Fails the job if any
# promoted screen is non-promotable (the script prints a trailing "NO" = P0>0 or P1>0).
#
# Why promoted, not staging: staging (ui-flow/e{N}-*/) is an iterative workshop that is
# ALLOWED to be incomplete / fail gates until `design-builder promote` runs G10+G12 on
# it. The contract that must never regress is the promoted zone. Staging stays covered
# (advisory) by design-builder Phase 5.5 + the LLM pr-reviewer — it is not hard-gated.
#
# This is the G10 (mechanical) half only; G12 (story coverage) + SCREENS-INDEX
# integrity stay at promote-time + pr-reviewer.

on:
  pull_request:
    paths:
      - 'ui-flow/agriflow-rwanda-design-system/project/screens/**'
      - '.claude/scripts/lint-prototypes.sh'
  push:
    branches: [main]
    paths:
      - 'ui-flow/agriflow-rwanda-design-system/project/screens/**'
      - '.claude/scripts/lint-prototypes.sh'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-lint:
    name: Design-system lint (G10 — promoted screens)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff base...head for changed files

      - name: Collect promoted screens to lint
        id: collect
        run: |
          set -euo pipefail
          SCREENS='^ui-flow/agriflow-rwanda-design-system/project/screens/.*\.html$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only the promoted screens this PR touched.
            gh pr diff "${{ github.event.pull_request.number }}" --name-only \
              | grep -E "$SCREENS" > "$RUNNER_TEMP/files.txt" || true
          else
            # On push to main, lint every promoted screen as a safety net.
            find ui-flow/agriflow-rwanda-design-system/project/screens -name '*.html' > "$RUNNER_TEMP/files.txt" || true
          fi
          count=$(grep -c . "$RUNNER_TEMP/files.txt" || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Promoted screens to lint: $count"
          cat "$RUNNER_TEMP/files.txt" || true

      - name: Run lint-prototypes.sh and gate on non-promotable screens
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p reports/ux
          mapfile -t FILES < "$RUNNER_TEMP/files.txt"
          # Script always exits 0 and prints one line per file ending in YES (clean,
          # P0:0 P1:0) or NO (P0>0 or P1>0). Gate fails on any trailing " NO".
          REPORTS_DIR=reports/ux bash .claude/scripts/lint-prototypes.sh "${FILES[@]}" | tee "$RUNNER_TEMP/lint.out"
          if grep -qE '[[:space:]]NO$' "$RUNNER_TEMP/lint.out"; then
            echo "::error::Design-system gate G10 failed — a PROMOTED screen is not clean (P0>0 or P1>0). Promoted screens must always pass; fix via design-builder, not a hand-edit."
            exit 1
          fi
          echo "Design-system gate G10 passed — all changed promoted screens clean (YES)."

      - name: No promoted screens changed
        if: steps.collect.outputs.count == '0'
        run: echo "No promoted screens changed — G10 gate N/A."
