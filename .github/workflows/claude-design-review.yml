name: AgriFlow PR Review

# Project-tightened PR review for flow-ui.
#
# Two layers, no waste:
#   - ci.yml runs the DETERMINISTIC 24-gate linter (lint-prototypes.sh) as the hard G10 gate.
#   - this workflow runs the deterministic G10 lint (evidence into reports/ux/) PLUS the LLM
#     reviewer for the judgment the script can't do (conventions, promotion-pipeline integrity,
#     bug scan), on EVERY PR.
#
# Design (rewritten to stop `error_max_turns` — mirrors the flow-fe pilot, flow-fe#47): the
# failure mode was the reviewer burning its whole turn budget on ingestion — the old prompt made
# it read prototypes.md + tokens.md + CLAUDE.md (~1,182 lines) before reviewing, on only
# --max-turns 15. Three levers fix it:
#   1. Read ONE condensed digest (`.claude/pr-review-checklist.md`) instead of the contract corpus.
#   2. Precompute + byte-cap the diff in a bash step so the reviewer reads two small files
#      (`review.diff`, `changed-files.txt`) plus the G10 evidence in reports/ux/.
#   3. Run Sonnet with a bounded --max-turns 25 (was 15 with a huge ingestion cost).
# An out-of-budget run is an INFRA failure, not a merge-blocking finding: the reviewer step is
# `continue-on-error`, and the outcome step posts a "review incomplete" note and passes green
# (founder policy 2026-07-05 — matches policy-only enforcement + founder-waiver).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: agriflow-pr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id kept as `agriflow-design-review` (NOT renamed) because pr-autopilot
  # (.claude/agents/pr-autopilot.md) looks up a check named `agriflow-design-review` to read this
  # reviewer's structured findings. The comment marker `<!-- pr-reviewer:v1 -->` is likewise
  # load-bearing — do not change either.
  agriflow-design-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write    # to post the review + the incomplete-note fallback
      issues: read
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sanity check — required files present
        id: sanity
        run: |
          missing=0
          for f in .claude/scripts/lint-prototypes.sh .claude/pr-review-checklist.md; do
            if [ ! -f "$f" ]; then
              echo "::warning::Required file missing: $f — review will skip"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Build review payload (precompute + cap the diff — not a Claude turn)
        id: payload
        if: steps.sanity.outputs.missing == '0'
        run: |
          set -euo pipefail
          # UTC start stamp — the outcome step uses it to detect a comment posted BY THIS RUN
          # (ISO-8601 UTC sorts lexicographically), so a stale marker can't mask a failed re-review.
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # Changed reviewable HTML: staging prototypes + promoted screens.
          gh pr diff "$PR" --name-only \
            | grep -E '^ui-flow/e[0-9].*\.html$|^ui-flow/agriflow-rwanda-design-system/project/screens/.*\.html$' \
            > changed-files.txt || true
          count=$(grep -c . changed-files.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"

          # Staging subset drives the deterministic G10 lint (evidence for the LLM reviewer).
          grep -E '^ui-flow/e[0-9].*\.html$' changed-files.txt > "$RUNNER_TEMP/design-files.txt" || true
          staging=$(grep -c . "$RUNNER_TEMP/design-files.txt" || true)
          echo "staging_count=$staging" >> "$GITHUB_OUTPUT"

          # Bounded unified diff of just the reviewable HTML. `gh pr diff` has no pathspec, so filter
          # the patch stream by file. The byte cap makes a giant PR unable to blow the turn budget.
          if [ "$count" -gt 0 ]; then
            gh pr diff "$PR" | awk '
              /^diff --git / { keep = ($3 ~ /\.html$/ && ($3 ~ /^a\/ui-flow\/e[0-9]/ || $3 ~ /^a\/ui-flow\/agriflow-rwanda-design-system\/project\/screens\//)) }
              keep
            ' > review.diff || true
          else
            : > review.diff
          fi
          CAP=600000  # ~600 KB
          if [ "$(wc -c < review.diff)" -gt "$CAP" ]; then
            head -c "$CAP" review.diff > review.diff.capped && mv review.diff.capped review.diff
            printf '\n\n[... diff truncated at %s bytes — review the above and note the truncation ...]\n' "$CAP" >> review.diff
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Reviewable *.html changed: $count (staging: $staging)"

      - name: Deterministic G10 lint → populate reports/ux evidence
        id: lint
        if: steps.sanity.outputs.missing == '0' && steps.payload.outputs.staging_count != '0'
        run: |
          set -euo pipefail
          mkdir -p reports/ux
          mapfile -t FILES < "$RUNNER_TEMP/design-files.txt"
          # Canonical 24-gate script. Writes reports/ux/<stem>-review.md with the exact
          # `**P0: n  P1: n  P2: n**` summary line the reviewer reads as G10 evidence. Always exits 0
          # here — the HARD gate lives in ci.yml; this run is just evidence for the LLM.
          REPORTS_DIR=reports/ux bash .claude/scripts/lint-prototypes.sh "${FILES[@]}" || true
          echo "Wrote G10 evidence to reports/ux/ for ${#FILES[@]} file(s)."

      - name: Run AgriFlow pr-reviewer
        id: review
        if: steps.sanity.outputs.missing == '0' && steps.payload.outputs.count != '0'
        continue-on-error: true    # any failure is infra here; the outcome step diagnoses and reports it
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # --model sonnet (founder 2026-07-05). --max-turns 25: with ingestion removed (digest +
          #   precomputed diff + G10 evidence), 25 is ample headroom (was 15 with the full corpus).
          claude_args: '--model sonnet --max-turns 25 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(cat:*),Bash(sed:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(rg:*),Read,Grep,Glob"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR }}

            You are the flow-ui design-system reviewer — this is NOT a generic review. Work entirely
            from precomputed artifacts; do NOT fetch the diff or open the contract corpus.

            1. Read `.claude/pr-review-checklist.md` — the condensed design-contract digest with the
               P0/P1/P2 model. That single file replaces reading prototypes.md + tokens.md + CLAUDE.md.
            2. Read `./review.diff` (the changed *.html, unified diff) and `./changed-files.txt`.
               Deterministic G10 evidence for changed STAGING prototypes is in `reports/ux/` — read it;
               if a gate is already clean there, don't re-flag it; if `reports/ux/` is empty, no
               staging changed → treat G10 as N/A (do NOT flag a missing report). Review FROM the diff;
               only `Read` a file when a finding needs surrounding context. If `review.diff` ends with a
               truncation marker, review what is present and say the diff was truncated.

            Your value-add is judgment the linter can't do: token link present + no inline `:root`; no
            stock Tailwind palette / hardcoded hex; breadcrumb-only header; h-10 controls (login h-11);
            tone-mapped status pills + single-hue role pills; modal a11y + audit rail; and for changed
            PROMOTED screens (`agriflow-rwanda-design-system/project/screens/*.html`) a SCREENS-INDEX
            row + the token link `../colors_and_type.css`. Plus a shallow bug scan. Tag every finding
            [P0]/[P1]/[P2].

            Post ONE top-level summary with `gh pr comment` that BEGINS with the marker
            `<!-- pr-reviewer:v1 -->`, followed by a `P0:n P1:n P2:n` roll-up and the tagged findings.
            Use `mcp__github_inline_comment__create_inline_comment` (confirmed: true) only for specific
            lines, and the full PR head SHA (${{ github.event.pull_request.head.sha }}) in any code
            links. Only post GitHub comments — do not return the review as a chat message. If there are
            no substantive findings, post a one-line
            `<!-- pr-reviewer:v1 --> No flow-ui design-system issues found.` comment.

      - name: Determine review outcome (post-and-pass on infra failure)
        if: always() && steps.sanity.outputs.missing == '0'
        run: |
          set -euo pipefail
          # No reviewable HTML? Post a clean note and pass.
          if [ "${{ steps.payload.outputs.count }}" = "0" ]; then
            gh pr comment "$PR" --body '<!-- pr-reviewer:v1 --> No reviewable `*.html` (staging / promoted) changes — flow-ui design-system review skipped.'
            echo "No reviewable files; skipped."
            exit 0
          fi

          # Did the reviewer post a marker comment DURING this run? (createdAt strictly after start.)
          START='${{ steps.payload.outputs.start }}'
          fresh=$(gh pr view "$PR" --json comments \
            | jq --arg start "$START" \
                '[.comments[] | select(.createdAt > $start and (.body | contains("pr-reviewer:v1")))] | length')

          if [ "${fresh:-0}" -ge 1 ]; then
            echo "Reviewer posted its verdict this run ($fresh marker comment(s))."
            exit 0
          fi

          # ── The reviewer produced no verdict. Say WHY, accurately. ──────────────────
          #
          # This block used to post "did not complete within its turn budget" for EVERY
          # cause. Six consecutive failures across #59–#64 therefore looked identical, and
          # the standing diagnosis ("raise --max-turns") was wrong: on flow-ui-ux#63 the
          # reviewer step ran 10:26:45 → 10:27:06 — 21 seconds. Twenty-five Sonnet turns
          # take minutes, so it was dying at startup, not exhausting a budget. A gate that
          # invents its own symptom cannot be debugged.
          #
          # Diagnose from the action's real signals: its step outcome, and its execution
          # log (the `execution_file` output — NOT a guessed path; see the upload step).
          OUTCOME='${{ steps.review.outcome }}'
          LOG='${{ steps.review.outputs.execution_file }}'

          reason="reason unknown"
          detail=""

          if [ "$OUTCOME" = "skipped" ]; then
            reason="the reviewer step was skipped (a guard condition excluded it)"
          elif [ -n "$LOG" ] && [ -f "$LOG" ]; then
            # Last `result` record carries subtype + error text. Tolerate any shape.
            subtype=$(jq -r '[.. | objects | select(.type? == "result") | .subtype?] | last // empty' "$LOG" 2>/dev/null || true)
            errtxt=$(jq -r '[.. | objects | select(.is_error? == true) | (.result? // .error? // .message?)] | last // empty' "$LOG" 2>/dev/null || true)
            case "$subtype" in
              error_max_turns)
                reason="it genuinely ran out of turns (\`error_max_turns\`) — raising \`--max-turns\` above 25 is the right fix here" ;;
              error_during_execution)
                reason="it errored during execution (\`error_during_execution\`)" ;;
              success)
                reason="it finished successfully but never posted a marker comment — the prompt's posting step did not run" ;;
              "")
                reason="its execution log has no result record (it died before finishing a turn)" ;;
              *)
                reason="it ended with \`$subtype\`" ;;
            esac
            [ -n "$errtxt" ] && detail=$(printf '%s' "$errtxt" | head -c 400)
          elif [ "$OUTCOME" = "failure" ]; then
            reason="the reviewer step failed and produced **no execution log** — that points at startup (auth, \`allowedTools\`, MCP server, or prompt construction), not model behaviour"
          else
            reason="the step reported \`$OUTCOME\` with no execution log"
          fi

          echo "::warning::AgriFlow design reviewer produced no verdict — $reason"
          {
            printf '<!-- pr-reviewer:v1 --> ⚠️ Automated review produced no verdict — %s.\n\n' "$reason"
            printf 'Step outcome: `%s`. Execution log: %s.\n\n' \
              "$OUTCOME" "$( [ -n "$LOG" ] && [ -f "$LOG" ] && echo 'attached as the `claude-execution-output` artifact' || echo '**not produced**' )"
            [ -n "$detail" ] && printf 'Error detail:\n```\n%s\n```\n\n' "$detail"
            printf 'This is infra, not a finding. Re-run the job or review manually. Non-blocking per founder policy.\n'
          } > "$RUNNER_TEMP/no-verdict.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/no-verdict.md"
          exit 0

      - name: Upload reviewer execution log (diagnostics)
        # Only when there IS a path. `execution_file` is empty whenever the reviewer step
        # was skipped (no reviewable HTML) or died before setting its outputs — and
        # upload-artifact hard-errors on an empty `path` ("Input required and not
        # supplied"), which would fail the check for the one case that is entirely normal.
        # The old hardcoded path never hit this because it was always non-empty; it just
        # matched nothing. The empty case is covered by the fallback step below.
        if: always() && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          # Use the action's OWN declared output, not a guessed path. The previous value
          # (`${runner.temp}/claude-execution-output.json`) matched nothing — every run
          # logged "No files were found with the provided path", so the one artifact that
          # could explain these failures was never captured.
          path: ${{ steps.review.outputs.execution_file }}
          if-no-files-found: warn

      - name: Log-path fallback (diagnose a missing execution log)
        if: always() && steps.review.outcome != 'skipped' && steps.review.outputs.execution_file == ''
        run: |
          # The action declares `execution_file`; if it is empty the action failed before
          # setting it. Capture what IS in the temp dir so the next failure is diagnosable
          # instead of another shrug.
          {
            echo "### Reviewer execution log missing"
            echo ""
            echo "\`steps.review.outputs.execution_file\` was empty (step outcome: \`${{ steps.review.outcome }}\`)."
            echo "Candidate files in \`\$RUNNER_TEMP\`:"
            echo '```'
            find "$RUNNER_TEMP" -maxdepth 2 -type f \( -name '*.json' -o -name '*claude*' \) -printf '%p  (%s bytes)\n' 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Workflow summary
        if: always()
        run: |
          if [ "${{ steps.sanity.outputs.missing }}" = "1" ]; then
            echo "## AgriFlow PR Review — SKIPPED (lint-prototypes.sh / pr-review-checklist.md missing)" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## AgriFlow PR Review"
              echo "Reviewable \`*.html\` changed: ${{ steps.payload.outputs.count }} (staging: ${{ steps.payload.outputs.staging_count }})"
              echo "Look for the review signed \`<!-- pr-reviewer:v1 -->\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
