name: AgriFlow PR Review

# Project-tightened PR review for flow-ui.
#
# Replaces the generic `/code-review` plugin (claude-code-review.yml, removed) with the
# repo's own AgriFlow-aware `pr-reviewer` agent, which checks every PR against the
# workspace conventions + design-system contracts (token compliance, breadcrumb-only
# header, h-10/h-11 controls, tone-mapped pills, modal a11y, gate-G10 integrity,
# SCREENS-INDEX integrity). Findings are triage-tagged [P0]/[P1]/[P2].
#
# Two layers, no waste:
#   - ci.yml runs the DETERMINISTIC 24-gate linter (lint-prototypes.sh) as the hard G10
#     gate (free; fails on BLOCKED).
#   - this workflow runs the LLM `pr-reviewer` for judgment the script can't do
#     (conventions, bug scan, promotion-pipeline integrity), on EVERY PR.
# The design-linter LLM agent is NOT invoked here anymore — the canonical script already
# encodes all 24 gates (incl. the founder-accepted refinements), so we run it directly
# below to populate reports/ux/ as the G10 evidence pr-reviewer reads. That saves the
# tokens the old "run design-linter as an LLM" step burned.
#
# Purpose: a merge-gate backstop for issues not addressed before merge — human PRs,
# residual findings, and drift.
#
# Depends on these files existing on the base branch when the workflow fires:
#   - .claude/agents/pr-reviewer.md
#   - .claude/scripts/lint-prototypes.sh

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: agriflow-pr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id is kept as `agriflow-design-review` (NOT renamed) because pr-autopilot
  # (.claude/agents/pr-autopilot.md) looks up a check named `agriflow-design-review`
  # to read this reviewer's structured findings. Renaming the job would break that.
  agriflow-design-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Hard ceiling so a hung review self-terminates in minutes instead of holding a
    # runner up to GitHub's 6h default. (--max-turns is the primary bound.)
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write    # to post the review comment
      issues: read
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the changed-files diff

      - name: Sanity check — required files present
        id: sanity
        run: |
          missing=0
          for f in .claude/agents/pr-reviewer.md .claude/scripts/lint-prototypes.sh; do
            if [ ! -f "$f" ]; then
              echo "::warning::Required file missing: $f — workflow will skip"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Determine changed staging prototypes
        id: changed
        if: steps.sanity.outputs.missing == '0'
        run: |
          set -euo pipefail
          gh pr diff "${{ github.event.pull_request.number }}" --name-only \
            | grep -E '^ui-flow/e[0-9].*\.html$' > "$RUNNER_TEMP/design-files.txt" || true
          count=$(grep -c . "$RUNNER_TEMP/design-files.txt" || true)
          echo "design_count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed staging prototypes: $count"

      - name: Deterministic G10 lint → populate reports/ux evidence
        id: lint
        if: steps.sanity.outputs.missing == '0' && steps.changed.outputs.design_count != '0'
        run: |
          set -euo pipefail
          mkdir -p reports/ux
          mapfile -t FILES < "$RUNNER_TEMP/design-files.txt"
          # Canonical 24-gate script (the design-linter agent's implementation). Writes
          # reports/ux/<stem>-review.md with the exact `**P0: n  P1: n  P2: n**` summary
          # line that pr-reviewer's gate-G10 evidence check greps for. Always exits 0
          # here — the HARD gate lives in ci.yml; this run is just evidence for the LLM.
          REPORTS_DIR=reports/ux bash .claude/scripts/lint-prototypes.sh "${FILES[@]}" || true
          echo "Wrote G10 evidence to reports/ux/ for ${#FILES[@]} file(s)."

      - name: Run AgriFlow pr-reviewer (every PR)
        if: steps.sanity.outputs.missing == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # --allowedTools is REQUIRED for the agent to post (gh + inline-comment tools);
          # without it the agent silently no-ops or loops to the timeout. --max-turns
          # bounds runtime. (We use the official claude-code-action review pattern with a
          # design-tailored prompt rather than "executing" the heavy multi-agent
          # pr-reviewer.md, which hung past the cap in the Action context.)
          claude_args: '--max-turns 15 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this flow-ui pull request against the design-system contracts — this is
            NOT a generic review. The canonical rules live in `.claude/rules/prototypes.md`
            (locked structural patterns + forbidden classes), `.claude/rules/tokens.md`
            (token usage), and `flow-ui/CLAUDE.md`. Read those, then review the changed files.

            Deterministic G10 evidence for any changed STAGING prototypes is in `reports/ux/`
            (populated by the prior step). If it is empty, no staging changed → treat G10 as
            N/A (do NOT flag a missing report).

            For changed `*.html`, check: token <link> present + no inline `:root`; no stock
            Tailwind palette (`bg-yellow-100` etc.) + no hardcoded hex; breadcrumb-only
            header; h-10 controls (login h-11); tone-mapped status pills + single-hue role
            pills; modal a11y. For changed PROMOTED screens
            (`agriflow-rwanda-design-system/project/screens/*.html`): they must have a
            SCREENS-INDEX row and the token link `../colors_and_type.css`. Plus a shallow
            bug scan of the diff.

            Be concise and finish quickly (small turn budget). Tag every finding
            [P0]/[P1]/[P2]. Post ONE top-level summary with `gh pr comment` that BEGINS with
            the marker `<!-- pr-reviewer:v1 -->`; use
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true) only for
            specific lines. Only post GitHub comments — do not return the review as a chat
            message. Use the full PR head SHA (${{ github.event.pull_request.head.sha }}) in
            any code links. If there are no substantive findings, post a one-line
            `<!-- pr-reviewer:v1 --> No flow-ui design-system issues found.` comment.

      - name: Workflow summary
        if: always()
        run: |
          if [ "${{ steps.sanity.outputs.missing }}" = "1" ]; then
            echo "## AgriFlow PR Review — SKIPPED (pr-reviewer.md / lint-prototypes.sh missing)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## AgriFlow PR Review — completed" >> "$GITHUB_STEP_SUMMARY"
            echo "Deterministic G10 evidence: ${{ steps.changed.outputs.design_count }} prototype(s) linted." >> "$GITHUB_STEP_SUMMARY"
            echo "Look for the review signed \`<!-- pr-reviewer:v1 -->\`." >> "$GITHUB_STEP_SUMMARY"
          fi
