<!doctype html>
<html><head><meta charset="utf-8"><title>Sidebar nav row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:Inter}
.list{width:260px;display:flex;flex-direction:column;gap:2px}
.item{height:40px;border-radius:8px;display:flex;align-items:center;gap:12px;padding:0 12px;font:500 13.5px Inter;color:var(--fg-4);cursor:pointer}
.item .ic{width:18px;height:18px;flex:none;color:currentColor}
.item.active{background:#F3FAF6;color:var(--green-500);font-weight:700}
.item.hover{background:var(--gray-50)}
.item .ch{margin-left:auto;opacity:.4;font-size:11px}
.item .b{margin-left:auto;background:var(--danger);color:#fff;font:700 10px Inter;padding:1px 7px;border-radius:9999px}
.lbl{font:700 10px Inter;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-400);margin:6px 12px}</style></head>
<body>
  <div class="list">
    <div class="lbl">Main</div>
    <div class="item active">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Dashboard
      <span class="ch">▾</span>
    </div>
    <div class="item">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      Orders
      <span class="b">12</span>
    </div>
    <div class="item hover">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
      Suppliers
      <span class="ch">›</span>
    </div>
  </div>
</body></html>
