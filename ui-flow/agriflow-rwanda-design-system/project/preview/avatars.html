<!doctype html>
<html><head><meta charset="utf-8"><title>Avatar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:Inter;display:flex;gap:24px;align-items:center}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;aspect-ratio:1/1;flex-shrink:0;background:var(--green-500);color:#fff;font-weight:700;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.who{display:flex;flex-direction:column}
.n{font:700 13px Inter;color:var(--fg-2)}
.t{font:400 11px Inter;color:var(--fg-5)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:var(--green-500);position:absolute;right:-1px;bottom:-1px}
.wrap{position:relative}</style></head>
<body>
  <div class="av" style="width:24px;height:24px;font-size:10px">SJ</div>
  <div class="av" style="width:32px;height:32px;font-size:12px">SJ</div>
  <div class="av" style="width:40px;height:40px;font-size:14px">SJ</div>
  <div class="wrap"><div class="av" style="width:48px;height:48px;font-size:16px">SJ</div><span class="dot"></span></div>
  <div class="row">
    <div class="av" style="width:34px;height:34px;font-size:13px">SJ</div>
    <div class="who"><span class="n">Sarah Johnson</span><span class="t">Operations Manager</span></div>
  </div>
</body></html>
