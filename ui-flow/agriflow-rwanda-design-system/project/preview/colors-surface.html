<!doctype html>
<html><head><meta charset="utf-8"><title>Surface</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .card{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .fill{height:80px;border-bottom:1px solid var(--border)}
  .meta{padding:10px 12px}
  .name{font-size:12px;font-weight:600;color:var(--fg-2)}
  .hex{font-size:11px;font-family:var(--font-mono);color:var(--fg-4);margin-top:2px}
</style></head>
<body>
  <div class="card"><div class="fill" style="background:#FFFFFF"></div><div class="meta"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div></div>
  <div class="card"><div class="fill" style="background:#F0F2F5"></div><div class="meta"><div class="name">Background</div><div class="hex">#F0F2F5</div></div></div>
  <div class="card"><div class="fill" style="background:#F3FAF6"></div><div class="meta"><div class="name">Green Tint</div><div class="hex">#F3FAF6</div></div></div>
  <div class="card"><div class="fill" style="background:#E8EBE9"></div><div class="meta"><div class="name">Border</div><div class="hex">#E8EBE9</div></div></div>
  <div class="card"><div class="fill" style="background:#111827"></div><div class="meta"><div class="name">Dark Surface</div><div class="hex">#111827</div></div></div>
</body></html>
