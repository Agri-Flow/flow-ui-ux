<!doctype html>
<html><head><meta charset="utf-8"><title>Primary Green</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px}
  .sw{flex:1;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;height:80px;border:1px solid var(--border)}
  .sw .name{font-size:11px;font-weight:600;line-height:1}
  .sw .hex{font-size:10px;font-family:var(--font-mono);margin-top:4px;line-height:1;opacity:.85}
  .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--gray-400);margin:0 0 0 2px}
</style></head>
<body>
  <div class="lbl">Primary — Green</div>
  <div class="row">
    <div class="sw" style="background:#F0FAF5;color:#0F5A33"><span class="name">50</span><span class="hex">#F0FAF5</span></div>
    <div class="sw" style="background:#C8ECDA;color:#0F5A33"><span class="name">100</span><span class="hex">#C8ECDA</span></div>
    <div class="sw" style="background:#92D9B5;color:#0A4025"><span class="name">200</span><span class="hex">#92D9B5</span></div>
    <div class="sw" style="background:#56C38A;color:#fff"><span class="name">300</span><span class="hex">#56C38A</span></div>
    <div class="sw" style="background:#2EA666;color:#fff"><span class="name">400</span><span class="hex">#2EA666</span></div>
    <div class="sw" style="background:#1B8C4E;color:#fff;outline:2px solid #1B8C4E;outline-offset:1px"><span class="name">500 ★</span><span class="hex">#1B8C4E</span></div>
    <div class="sw" style="background:#157342;color:#fff"><span class="name">600</span><span class="hex">#157342</span></div>
    <div class="sw" style="background:#0F5A33;color:#fff"><span class="name">700</span><span class="hex">#0F5A33</span></div>
    <div class="sw" style="background:#0A4025;color:#fff"><span class="name">800</span><span class="hex">#0A4025</span></div>
    <div class="sw" style="background:#052918;color:#fff"><span class="name">900</span><span class="hex">#052918</span></div>
  </div>
</body></html>
