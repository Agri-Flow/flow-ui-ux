<!doctype html>
<html><head><meta charset="utf-8"><title>Eyebrow + Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:16px}
.spec{font-family:var(--font-mono);font-size:11px;color:var(--fg-5);min-width:160px}</style></head>
<body>
<div class="row"><div class="spec">Inter Bold · 11/13 · +1.2 caps</div><div style="font:700 11px/1 Inter;letter-spacing:1.2px;color:var(--gray-400);text-transform:uppercase">Primary — Green</div></div>
<div class="row"><div class="spec">Inter Bold · 10/12 · +1.2 caps</div><div style="font:700 10px/1 Inter;letter-spacing:1.2px;color:var(--gray-400);text-transform:uppercase">Operations</div></div>
<div class="row"><div class="spec">Menlo · 12 — code</div><div style="font:400 12px/1.4 Menlo,'Courier New',monospace;color:var(--fg-2)">user.role = "operations_manager"</div></div>
<div class="row"><div class="spec">Courier New · 10.5 — log</div><div style="font:400 10.5px/1.4 'Courier New',Menlo,monospace;color:var(--fg-3)">2026-04-27 14:02:18 · POST /api/v1/orders</div></div>
</body></html>
