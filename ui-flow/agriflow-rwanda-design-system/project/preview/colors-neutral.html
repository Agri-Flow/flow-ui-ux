<!doctype html>
<html><head><meta charset="utf-8"><title>Neutral Gray</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px}
  .sw{flex:1;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;height:80px;border:1px solid var(--border)}
  .sw .name{font-size:11px;font-weight:600;line-height:1}
  .sw .hex{font-size:10px;font-family:var(--font-mono);margin-top:4px;line-height:1;opacity:.85}
  .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--gray-400);margin:0 0 0 2px}
</style></head>
<body>
  <div class="lbl">Neutral — Gray</div>
  <div class="row">
    <div class="sw" style="background:#F9FAFB;color:#374151"><span class="name">50</span><span class="hex">#F9FAFB</span></div>
    <div class="sw" style="background:#F0F2F5;color:#374151"><span class="name">100</span><span class="hex">#F0F2F5</span></div>
    <div class="sw" style="background:#E8EBE9;color:#374151"><span class="name">200</span><span class="hex">#E8EBE9</span></div>
    <div class="sw" style="background:#D1D5DB;color:#1F2937"><span class="name">300</span><span class="hex">#D1D5DB</span></div>
    <div class="sw" style="background:#B0B7BE;color:#fff"><span class="name">400</span><span class="hex">#B0B7BE</span></div>
    <div class="sw" style="background:#8896A4;color:#fff"><span class="name">500</span><span class="hex">#8896A4</span></div>
    <div class="sw" style="background:#5F6B7A;color:#fff"><span class="name">600</span><span class="hex">#5F6B7A</span></div>
    <div class="sw" style="background:#374151;color:#fff"><span class="name">700</span><span class="hex">#374151</span></div>
    <div class="sw" style="background:#1F2937;color:#fff"><span class="name">800</span><span class="hex">#1F2937</span></div>
    <div class="sw" style="background:#111827;color:#fff"><span class="name">900</span><span class="hex">#111827</span></div>
  </div>
</body></html>
