<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:16px;font-family:Inter}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{font:600 13.5px Inter;border-radius:8px;padding:10px 16px;border:1px solid transparent;cursor:pointer}
.primary{background:var(--green-500);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.primary:hover{background:var(--green-600)}
.secondary{background:#fff;color:var(--fg-2);border-color:var(--border)}
.ghost{background:transparent;color:var(--green-500);border:none;padding:10px 12px}
.danger{background:var(--danger-strong);color:#fff}
.disabled{background:var(--gray-100);color:var(--fg-6);box-shadow:none;cursor:not-allowed}
.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--gray-400)}</style></head>
<body>
  <div class="lbl">Primary / Secondary / Ghost / Danger</div>
  <div class="row">
    <button class="primary">Sign in</button>
    <button class="secondary">Cancel</button>
    <button class="ghost">Forgot password?</button>
    <button class="danger">Suspend user</button>
    <button class="primary disabled">Disabled</button>
  </div>
  <div class="lbl">Sizes</div>
  <div class="row">
    <button class="primary sm">+ New supplier</button>
    <button class="primary">+ New supplier</button>
    <button class="primary" style="padding:14px 22px;font-size:14px">+ New supplier</button>
  </div>
</body></html>
