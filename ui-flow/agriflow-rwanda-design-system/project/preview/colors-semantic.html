<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
  .card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
  .swatch{width:18px;height:18px;border-radius:5px;margin-bottom:4px}
  .name{font-size:13px;font-weight:600;color:var(--fg-2)}
  .hex{font-size:11px;font-family:var(--font-mono);color:var(--fg-4)}
  .pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:9999px;width:fit-content;margin-top:2px}
</style></head>
<body>
  <div class="card"><div class="swatch" style="background:#1B8C4E"></div><div class="name">Success</div><div class="hex">#1B8C4E</div><span class="pill" style="background:#EEF6F2;color:#117E44">Active</span></div>
  <div class="card"><div class="swatch" style="background:#F59E0B"></div><div class="name">Warning</div><div class="hex">#F59E0B</div><span class="pill" style="background:#FEF9C3;color:#854D0E">Pending</span></div>
  <div class="card"><div class="swatch" style="background:#E74C3C"></div><div class="name">Danger</div><div class="hex">#E74C3C</div><span class="pill" style="background:#FEE2E2;color:#B91C1C">Suspended</span></div>
  <div class="card"><div class="swatch" style="background:#3B82F6"></div><div class="name">Info</div><div class="hex">#3B82F6</div><span class="pill" style="background:#EFF6FF;color:#1D4ED8">Reviewing</span></div>
</body></html>
