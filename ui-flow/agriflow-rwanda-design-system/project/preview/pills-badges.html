<!doctype html>
<html><head><meta charset="utf-8"><title>Status pills</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:#fff;font-family:Inter;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9999px;font:600 12px Inter}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.lbl{font:700 10px Inter;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-400)}
.badge{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 7px;border-radius:9999px;background:var(--danger);color:#fff;font:700 10px Inter}</style></head>
<body>
  <div class="lbl">Status pills</div>
  <div class="row">
    <span class="pill" style="background:#EEF6F2;color:#117E44">Active</span>
    <span class="pill" style="background:#FEF9C3;color:#854D0E">Pending</span>
    <span class="pill" style="background:#FEE2E2;color:#B91C1C">Suspended</span>
    <span class="pill" style="background:#FEF3C7;color:#92400E">Expired</span>
    <span class="pill" style="background:#EFF6FF;color:#1D4ED8">In review</span>
    <span class="pill" style="background:#F3E8FF;color:#7E22CE">Draft</span>
    <span class="pill" style="background:#F0F2F5;color:#5F6B7A">Archived</span>
  </div>
  <div class="lbl">Numeric badges</div>
  <div class="row">
    <span class="badge">1</span>
    <span class="badge">12</span>
    <span class="badge">99</span>
    <span class="badge" style="background:var(--green-500)">3</span>
    <span class="badge" style="background:var(--gray-500)">—</span>
  </div>
</body></html>
