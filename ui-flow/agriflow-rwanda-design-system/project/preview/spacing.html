<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:#fff;display:flex;flex-direction:column;gap:6px;font-family:var(--font-sans)}
  .hd{display:grid;grid-template-columns:64px 56px 1fr;gap:14px;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--fg-5);padding:0 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .row{display:grid;grid-template-columns:64px 56px 1fr;gap:14px;align-items:center;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-4);padding:3px 0}
  .tk{color:var(--fg-2);font-weight:600}
  .px{color:var(--fg-4);text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:14px;background:var(--green-500);border-radius:3px}
</style></head>
<body>
  <div class="hd"><span>Token</span><span class="px">Px</span><span>Scale</span></div>
  <div class="row"><span class="tk">space-1</span><span class="px">4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tk">space-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tk">space-3</span><span class="px">12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="tk">space-4</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tk">space-5</span><span class="px">20</span><div class="bar" style="width:20px"></div></div>
  <div class="row"><span class="tk">space-6</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tk">space-8</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tk">space-10</span><span class="px">40</span><div class="bar" style="width:40px"></div></div>
  <div class="row"><span class="tk">space-12</span><span class="px">48</span><div class="bar" style="width:48px"></div></div>
</body></html>
