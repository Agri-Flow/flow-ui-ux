<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:32px;background:#fff;display:flex;gap:24px;align-items:center}
.s{width:140px;height:80px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.t{font-size:11px;font-weight:700;color:var(--fg-2)}
.l{font-size:10px;color:var(--fg-5);font-family:var(--font-mono);margin-top:2px}</style></head>
<body>
  <div class="s" style="box-shadow:none"><div class="t">flat</div><div class="l">none</div></div>
  <div class="s" style="box-shadow:0 1px 2px rgba(0,0,0,.05)"><div class="t">btn</div><div class="l">0 1 2 / .05</div></div>
  <div class="s" style="box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)"><div class="t">card</div><div class="l">2-layer</div></div>
  <div class="s" style="box-shadow:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04)"><div class="t">popover</div><div class="l">heavier</div></div>
  <div class="s" style="box-shadow:1px 0 4px rgba(0,0,0,.04),4px 0 16px rgba(0,0,0,.08)"><div class="t">sidebar</div><div class="l">directional</div></div>
</body></html>
