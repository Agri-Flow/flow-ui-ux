<!doctype html>
<html><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:16px}
.spec{font-family:var(--font-mono);font-size:11px;color:var(--fg-5);min-width:140px}
.t{color:var(--fg-1)}</style></head>
<body>
<div class="row"><div class="spec">Inter Bold · 24/32</div><div class="t" style="font:700 24px/32px Inter;letter-spacing:-.3px">Welcome back</div></div>
<div class="row"><div class="spec">Inter Bold · 22/26</div><div class="t" style="font:700 22px/1.18 Inter">FleetFlow Color Palette</div></div>
<div class="row"><div class="spec">Inter SemiBold · 20/24</div><div class="t" style="font:600 20px/1.2 Inter;color:var(--fg-2)">Supplier Directory</div></div>
<div class="row"><div class="spec">Inter SemiBold · 18/22</div><div class="t" style="font:600 18px/1.2 Inter;color:var(--fg-2)">Reducing post-harvest food loss</div></div>
</body></html>
