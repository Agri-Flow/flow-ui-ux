<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:18px;align-items:center}
.r{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{width:64px;height:64px;background:var(--green-500);border:1px solid var(--border)}
.lbl{font-size:11px;color:var(--fg-4);font-family:var(--font-mono)}
.t{font-size:11px;font-weight:600;color:var(--fg-2)}</style></head>
<body>
  <div class="r"><div class="b" style="border-radius:6px"></div><div class="t">sm</div><div class="lbl">6px</div></div>
  <div class="r"><div class="b" style="border-radius:8px"></div><div class="t">md</div><div class="lbl">8px</div></div>
  <div class="r"><div class="b" style="border-radius:10px"></div><div class="t">lg</div><div class="lbl">10px</div></div>
  <div class="r"><div class="b" style="border-radius:12px"></div><div class="t">xl</div><div class="lbl">12px</div></div>
  <div class="r"><div class="b" style="border-radius:50%"></div><div class="t">round</div><div class="lbl">9999</div></div>
  <div class="r"><div class="b" style="border-radius:9999px;width:120px;height:32px"></div><div class="t">pill</div><div class="lbl">9999</div></div>
</body></html>
